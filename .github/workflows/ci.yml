name: CI

# 壊れたまま push されるのを防ぐ。整形・Lint・型チェック・ビルドを通す。
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # 文言の語尾がそろっているか（体言止めとです・ますが混ざるのを防ぐ）
      - name: Copy
        run: npm run check:copy

      # build が tsc -b も走らせるので、型チェックはここで一緒に見る
      - name: Typecheck & build
        run: npm run build
